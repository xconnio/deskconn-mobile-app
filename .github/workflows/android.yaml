name: Build & Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable

      - name: Install dependencies
        run: make install

      - name: Build APK
        run: make build-apk

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > deskconn-release-key.jks

      - name: Install Android SDK Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner

      - name: Sign APK
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore deskconn-release-key.jks \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            build/app/outputs/flutter-apk/app-release.apk ${{ secrets.KEY_ALIAS }}

          zipalign -v 4 build/app/outputs/flutter-apk/app-release.apk deskconn-mobile-app.apk
          apksigner verify deskconn-mobile-app.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Deskconn Mobile – Release ${{ github.run_number }}
          body: "Changes: ${{ github.event.head_commit.message }}"
          files: deskconn-mobile-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
